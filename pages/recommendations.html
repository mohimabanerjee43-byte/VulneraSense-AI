<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Recommendations | VulneraSense
    </title>


    <link
        rel="stylesheet"
        href="../css/style.css">

    <link
        rel="stylesheet"
        href="../css/responsive.css">

</head>


<body data-page="recommendations">


    <!-- =====================================================
         APPLICATION CONTAINER
         ===================================================== -->

    <div id="app"></div>


    <!-- =====================================================
         APPLICATION SCRIPTS
         ===================================================== -->

    <script src="../js/app.js"></script>

    <script src="../js/navigation.js"></script>

    <!-- IMPORTANT: singular recommendation.js -->

    <script src="../js/recommendation.js"></script>


    <script>

        /* =====================================================
           LOAD RECOMMENDATIONS PAGE
           ===================================================== */

        function loadRecommendations() {

            const pageContent =
                document.getElementById(
                    "pageContent"
                );


            /*
             * app.js creates pageContent dynamically.
             */

            if (!pageContent) {

                setTimeout(
                    loadRecommendations,
                    50
                );

                return;

            }


            /* =================================================
               READ SAVED ASSESSMENT RESULT
               ================================================= */

            const raw =
                localStorage.getItem(
                    "vulneraSenseResult"
                );


            let data = null;


            try {

                data =
                    raw
                        ? JSON.parse(raw)
                        : null;

            } catch (error) {

                console.error(
                    "Unable to read assessment result:",
                    error
                );

                data = null;

            }


            /* =================================================
               DEFAULT LEVEL
               ================================================= */

            const level =
                data && data.level
                    ? data.level
                    : {

                        key: "low",

                        name:
                            "No assessment yet",

                        desc:
                            "Complete an assessment first."

                    };


            const score =
                data
                    ? Number(
                        data.score ??
                        data.riskScore ??
                        0
                    )
                    : 0;


            /*
             * Try to find the original user input.
             *
             * Different assessment versions may save
             * the text under different property names.
             */

            const problemText =
                data
                    ? (
                        data.text ||
                        data.input ||
                        data.userInput ||
                        data.problemText ||
                        data.message ||
                        data.transcript ||
                        ""
                    )
                    : "";


            /* =================================================
               CREATE PAGE
               ================================================= */

            pageContent.innerHTML = `


                <!-- =========================================
                     PAGE HEADER
                     ========================================= -->

                <div class="recommendation-page-header">

                    <p class="eyebrow">
                        AI-ASSISTED VULNERABILITY SCREENING
                    </p>

                    <h1>
                        Recommended Solutions
                    </h1>

                    <p class="recommendation-intro">
                        Review the recommended support pathway
                        and the available support options below.
                    </p>

                </div>


                <!-- =========================================
                     TOP RECOMMENDATION
                     ========================================= -->

                <section
                    class="top-recommendation"
                    aria-label="Top Recommendation">


                    <div
                        id="topRecommendationPanel"
                        class="top-rec-panel">


                        <div class="top-rec-header">

                            <div>

                                <span class="top-rec-label">
                                    ⭐ TOP RECOMMENDATION
                                </span>

                                <h2>
                                    Recommended Support Path
                                </h2>

                            </div>


                            <span class="top-rec-score">
                                ${score}/100
                            </span>

                        </div>


                        <div class="top-rec-content">

                            <div class="top-rec-icon">
                                ⭐
                            </div>


                            <div class="top-rec-text">

                                <h3>
                                    Analyzing Assessment...
                                </h3>

                                <p>
                                    The most appropriate support
                                    pathway will appear here.
                                </p>

                                <span class="top-rec-tag">
                                    RECOMMENDED
                                </span>

                            </div>

                        </div>

                    </div>

                </section>


                <!-- =========================================
                     AVAILABLE RECOMMENDATIONS
                     ========================================= -->

                <section
                    class="recommendation-section">


                    <div
                        class="recommendation-heading">


                        <div>

                            <p class="eyebrow">
                                STEP 3
                            </p>

                            <h2>
                                Available Recommendations
                            </h2>

                        </div>


                        <span
                            id="recommendationBadge"
                            class="status">

                            ${escapeHTML(
                                level.name
                            )}

                        </span>


                    </div>


                    <!-- EXACTLY FIVE CARDS -->

                    <div
                        id="recommendationGrid"
                        class="recommendation-grid">

                    </div>


                </section>


                <!-- =========================================
                     SCREENING RESULT
                     ========================================= -->

                ${
                    data
                        ? `

                            <section
                                class="card panel screening-result-card">


                                <div
                                    class="screening-result-header">


                                    <div>

                                        <p class="eyebrow">
                                            SCREENING RESULT
                                        </p>

                                        <h3>
                                            Vulnerability Level
                                        </h3>

                                    </div>


                                    <div
                                        class="risk-score">

                                        ${score}

                                        <span>
                                            /100
                                        </span>

                                    </div>


                                </div>


                                <p class="screening-description">

                                    ${escapeHTML(
                                        level.desc ||
                                        "The result should be reviewed by a trained human."
                                    )}

                                </p>


                            </section>

                        `
                        : `
                            <section
                                class="card panel screening-result-card">

                                <p class="eyebrow">
                                    SCREENING RESULT
                                </p>

                                <h3>
                                    No assessment yet
                                </h3>

                                <p class="screening-description">
                                    Complete an assessment to generate
                                    a personalized recommendation.
                                </p>

                            </section>
                        `
                }


                <!-- =========================================
                     SAFETY NOTE
                     ========================================= -->

                <div class="note">

                    <b>
                        Prototype Safety:
                    </b>

                    These recommendations are examples
                    for an educational prototype.

                    A real system should use validated
                    assessment methods, informed consent,
                    privacy controls and trained human review.

                </div>


            `;


            /* =================================================
               RENDER TOP RECOMMENDATION
               ================================================= */

            if (
                typeof updateRecommendationSystem ===
                "function"
            ) {

                updateRecommendationSystem(
                    problemText,
                    score
                );

            } else {

                /*
                 * At minimum, render the five cards.
                 */

                renderFallbackRecommendations();

                console.error(
                    "recommendation.js was not loaded correctly."
                );

            }

        }


        /* =====================================================
           FALLBACK — ALWAYS FIVE CARDS
           ===================================================== */

        function renderFallbackRecommendations() {

            const grid =
                document.getElementById(
                    "recommendationGrid"
                );


            if (!grid) {
                return;
            }


            grid.innerHTML = `

                <!-- 1 -->

                <article class="rec-card">

                    <div class="rec-icon">
                        🧠
                    </div>

                    <h3>
                        Counselling Support
                    </h3>

                    <p>
                        Consider speaking with a qualified
                        counsellor or mental-health professional
                        for supportive guidance.
                    </p>

                    <span>
                        SUPPORT
                    </span>

                </article>


                <!-- 2 -->

                <article class="rec-card">

                    <div class="rec-icon">
                        🤝
                    </div>

                    <h3>
                        Trusted Person
                    </h3>

                    <p>
                        Consider reaching out to a trusted
                        family member, teacher, mentor or
                        other safe support person.
                    </p>

                    <span>
                        SUPPORT
                    </span>

                </article>


                <!-- 3 -->

                <article class="rec-card">

                    <div class="rec-icon">
                        👤
                    </div>

                    <h3>
                        Human Review
                    </h3>

                    <p>
                        A trained human should review the
                        situation instead of relying only
                        on an automated result.
                    </p>

                    <span>
                        HUMAN REVIEW
                    </span>

                </article>


                <!-- 4 -->

                <article class="rec-card">

                    <div class="rec-icon">
                        ⚖️
                    </div>

                    <h3>
                        Legal Assistance
                    </h3>

                    <p>
                        When appropriate, legal guidance
                        can help with rights, reporting
                        or other legal concerns.
                    </p>

                    <span>
                        LEGAL AID
                    </span>

                </article>


                <!-- 5 -->

                <article class="rec-card">

                    <div class="rec-icon">
                        🏥
                    </div>

                    <h3>
                        Medical Assistance
                    </h3>

                    <p>
                        Where appropriate, a qualified
                        healthcare professional can provide
                        further assessment and support.
                    </p>

                    <span>
                        MEDICAL
                    </span>

                </article>

            `;

        }


        /* =====================================================
           HTML ESCAPE
           ===================================================== */

        function escapeHTML(text) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                String(text);


            return div.innerHTML;

        }


        /* =====================================================
           START PAGE
           ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            loadRecommendations
        );

    </script>


    <!-- =====================================================
         PAGE-SPECIFIC STYLES
         ===================================================== -->

    <style>


        /* =====================================================
           PAGE HEADER
           ===================================================== */

        .recommendation-page-header {

            margin-bottom: 20px;

        }


        .recommendation-page-header h1 {

            margin:
                5px 0 8px;

            font-size: 28px;

            color:
                #182338;

        }


        .recommendation-intro {

            color:
                #78849d;

            font-size: 12px;

            line-height: 1.6;

            max-width: 700px;

        }


        /* =====================================================
           TOP RECOMMENDATION SECTION
           ===================================================== */

        .top-recommendation {

            margin-top: 20px;

            margin-bottom: 28px;

        }


        .top-rec-panel {

            background:
                #ffffff;

            border:
                1px solid #dce8e4;

            border-radius:
                18px;

            padding:
                22px 24px;

            box-shadow:
                0 10px 30px
                rgba(24, 35, 56, .08);

            position:
                relative;

            overflow:
                hidden;

        }


        .top-rec-panel::before {

            content:
                "";

            position:
                absolute;

            left:
                0;

            top:
                0;

            bottom:
                0;

            width:
                5px;

            background:
                #61d7bc;

        }


        .top-rec-panel.emergency::before {

            background:
                #e85d5d;

        }


        /* =====================================================
           TOP HEADER
           ===================================================== */

        .top-rec-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            gap:
                20px;

        }


        .top-rec-label {

            display:
                inline-block;

            font-size:
                9px;

            font-weight:
                800;

            letter-spacing:
                1.2px;

            color:
                #21866f;

            margin-bottom:
                5px;

        }


        .top-rec-panel.emergency
        .top-rec-label {

            color:
                #c43f3f;

        }


        .top-rec-header h2 {

            margin:
                0;

            font-size:
                17px;

            color:
                #182338;

        }


        .top-rec-score {

            font-size:
                13px;

            font-weight:
                700;

            color:
                #78849d;

            white-space:
                nowrap;

        }


        /* =====================================================
           TOP CONTENT
           ===================================================== */

        .top-rec-content {

            display:
                flex;

            align-items:
                center;

            gap:
                18px;

            margin-top:
                18px;

        }


        .top-rec-icon {

            width:
                58px;

            height:
                58px;

            min-width:
                58px;

            border-radius:
                16px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                #edf8f5;

            font-size:
                29px;

        }


        .top-rec-panel.emergency
        .top-rec-icon {

            background:
                #fff0f0;

        }


        .top-rec-text h3 {

            margin:
                0 0 6px;

            font-size:
                19px;

            color:
                #182338;

        }


        .top-rec-text p {

            margin:
                0;

            color:
                #78849d;

            font-size:
                11px;

            line-height:
                1.6;

        }


        .top-rec-tag {

            display:
                inline-block;

            margin-top:
                10px;

            padding:
                5px 9px;

            border-radius:
                12px;

            background:
                #edf8f5;

            color:
                #21866f;

            font-size:
                8px;

            font-weight:
                700;

            letter-spacing:
                .5px;

        }


        .top-rec-panel.emergency
        .top-rec-tag {

            background:
                #fff0f0;

            color:
                #c43f3f;

        }


        /* =====================================================
           AVAILABLE RECOMMENDATIONS
           ===================================================== */

        .recommendation-section {

            margin-top:
                10px;

        }


        .recommendation-heading {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                flex-end;

            gap:
                20px;

            margin-bottom:
                15px;

        }


        .recommendation-heading h2 {

            margin:
                4px 0 0;

            font-size:
                21px;

            color:
                #182338;

        }


        .recommendation-grid {

            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                15px;

        }


        /* =====================================================
           RECOMMENDATION CARD
           ===================================================== */

        .rec-card {

            background:
                #ffffff;

            border:
                1px solid #e4e9f1;

            border-radius:
                15px;

            padding:
                20px;

            min-height:
                175px;

            box-shadow:
                0 8px 28px
                rgba(24, 35, 56, .07);

            transition:
                transform .2s ease,
                box-shadow .2s ease;

        }


        .rec-card:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 12px 32px
                rgba(24, 35, 56, .10);

        }


        .rec-icon {

            font-size:
                27px;

        }


        .rec-card h3 {

            font-size:
                13px;

            margin:
                10px 0 7px;

            color:
                #182338;

        }


        .rec-card p {

            font-size:
                10px;

            line-height:
                1.6;

            color:
                #78849d;

        }


        .rec-card span {

            display:
                inline-block;

            margin-top:
                13px;

            background:
                #edf8f5;

            color:
                #21866f;

            border-radius:
                12px;

            padding:
                5px 8px;

            font-size:
                8px;

            font-weight:
                600;

        }


        /* =====================================================
           SCREENING RESULT
           ===================================================== */

        .screening-result-card {

            margin-top:
                25px;

        }


        .screening-result-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                20px;

        }


        .screening-result-header h3 {

            margin:
                4px 0 0;

            font-size:
                16px;

        }


        .risk-score {

            font-size:
                28px;

            font-weight:
                700;

            color:
                #182338;

        }


        .risk-score span {

            font-size:
                12px;

            color:
                #78849d;

            font-weight:
                400;

        }


        .screening-description {

            margin-top:
                10px;

            font-size:
                12px;

            color:
                #78849d;

            line-height:
                1.6;

        }


        /* =====================================================
           SAFETY NOTE
           ===================================================== */

        .note {

            margin-top:
                18px;

            background:
                #fff8e7;

            border:
                1px solid #f1dfae;

            border-radius:
                12px;

            padding:
                14px;

            font-size:
                10px;

            color:
                #6e5d31;

            line-height:
                1.5;

        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 1000px) {

            .recommendation-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            .recommendation-page-header h1 {

                font-size:
                    23px;

            }


            .top-rec-panel {

                padding:
                    18px;

            }


            .top-rec-header {

                flex-direction:
                    column;

                gap:
                    8px;

            }


            .top-rec-content {

                align-items:
                    flex-start;

            }


            .recommendation-heading {

                align-items:
                    flex-start;

                flex-direction:
                    column;

            }


            .recommendation-grid {

                grid-template-columns:
                    1fr;

            }

        }


    </style>


</body>

</html>
