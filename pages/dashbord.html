<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Dashboard | VulneraSense
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css">

    <link
        rel="stylesheet"
        href="../css/dashboard.css">

    <link
        rel="stylesheet"
        href="../css/responsive.css">

</head>


<body data-page="dashboard">

<div id="app"></div>


<script src="../js/app.js"></script>

<script src="../js/navigation.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        setTimeout(() => {

            document
                .getElementById(
                    "pageContent"
                )
                .innerHTML = `

                <div class="hero">

                    <div class="hero-content">

                        <span class="tag">
                            MULTILINGUAL NLP +
                            SPEECH ANALYSIS
                        </span>

                        <h2>
                            Turn voice or text into
                            a safer support pathway.
                        </h2>

                        <p>
                            Enter a short sample,
                            run the prototype analysis
                            and view a non-diagnostic
                            vulnerability category.
                        </p>

                        <button
                            class="btn btn-primary"
                            data-go="assessment">

                            Start Assessment →

                        </button>

                    </div>

                    <div class="hero-art">

                        <div class="ring"></div>

                        <div class="ai-orb">
                            AI
                        </div>

                    </div>

                </div>

                `;

        }, 100);

    }
);

</script>

</body>
</html>
