<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Assessment Results | VulneraSense</title>


    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >


    <style>

        /* -----------------------------------------
           RESULTS PAGE
        ----------------------------------------- */

        .results-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding-bottom: 50px;
        }


        .result-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 32px;
            margin-top: 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.06);
        }


        .result-top {
            display: flex;
            align-items: center;
            gap: 28px;
        }


        .score-circle {
            width: 120px;
            height: 120px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f1f7f5;

            border: 8px solid #dcece7;

            flex-shrink: 0;
        }


        .score-number {
            font-size: 30px;
            font-weight: 800;
        }


        .score-number span {
            font-size: 14px;
            font-weight: 500;
            color: #777;
        }


        .eyebrow {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #667;
            margin-bottom: 7px;
        }


        .result-title {
            margin: 0 0 8px;
            font-size: 27px;
        }


        .result-description {
            color: #666;
            line-height: 1.6;
            margin: 0;
        }


        /* -----------------------------------------
           METER
        ----------------------------------------- */

        .meter-section {
            margin-top: 30px;
        }


        .meter {
            height: 14px;
            width: 100%;

            border-radius: 20px;

            background: linear-gradient(
                to right,
                #cfe8dc 0%,
                #e8e7bd 45%,
                #f0d9a8 65%,
                #e6b4aa 100%
            );

            position: relative;
            overflow: hidden;
        }


        .meter-fill {
            height: 100%;

            width: 10%;

            background: #243a59;

            border-radius: 20px;

            transition: width 0.7s ease;
        }


        .meter-labels {
            display: flex;
            justify-content: space-between;

            font-size: 11px;
            color: #777;

            margin-top: 8px;
        }


        /* -----------------------------------------
           SECTION CARDS
        ----------------------------------------- */

        .section-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 27px;

            margin-top: 22px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
        }


        .section-card h2 {
            margin-top: 0;
            margin-bottom: 8px;
        }


        .section-subtitle {
            color: #777;
            margin-top: 0;
        }


        /* -----------------------------------------
           INDICATORS
        ----------------------------------------- */

        .indicator-list {
            margin-top: 20px;

            display: grid;

            gap: 12px;
        }


        .indicator {
            padding: 14px 16px;

            border-radius: 12px;

            background: #f6f8f8;

            display: flex;
            align-items: center;

            gap: 10px;
        }


        .indicator-icon {
            font-weight: bold;
        }


        /* -----------------------------------------
           SAFETY ALERT
        ----------------------------------------- */

        .safety-alert {
            background: #fff7e8;

            border: 1px solid #f0d49a;

            border-left: 6px solid #d89a25;

            border-radius: 16px;

            padding: 20px;

            margin-top: 20px;
        }


        .safety-alert h3 {
            margin: 0 0 8px;

            color: #765000;
        }


        .safety-alert p {
            margin: 0;

            line-height: 1.6;

            color: #674f28;
        }


        .safety-badge {
            display: inline-block;

            padding: 7px 12px;

            margin-bottom: 12px;

            border-radius: 20px;

            background: #f5d99d;

            color: #684700;

            font-size: 12px;

            font-weight: 700;
        }


        /* -----------------------------------------
           SUBMITTED SAMPLE
        ----------------------------------------- */

        .submitted-text {
            background: #f7f7f7;

            border-radius: 12px;

            padding: 18px;

            line-height: 1.7;

            color: #444;

            white-space: pre-wrap;

            word-break: break-word;
        }


        /* -----------------------------------------
           NEXT STEP
        ----------------------------------------- */

        .next-step {
            background: #f2f6ff;

            border-radius: 16px;

            padding: 22px;

            margin-top: 22px;
        }


        .next-step h3 {
            margin-top: 0;
        }


        .next-step p {
            line-height: 1.6;
            color: #555;
        }


        .result-button {
            display: inline-block;

            margin-top: 18px;

            padding: 13px 22px;

            border-radius: 10px;

            background: #243a59;

            color: white;

            text-decoration: none;

            font-weight: 700;
        }


        .result-button:hover {
            opacity: 0.9;
        }


        /* -----------------------------------------
           DISCLAIMER
        ----------------------------------------- */

        .disclaimer {
            margin-top: 25px;

            padding: 16px;

            border-radius: 12px;

            background: #f5f5f5;

            color: #666;

            font-size: 12px;

            line-height: 1.6;
        }


        /* -----------------------------------------
           MOBILE
        ----------------------------------------- */

        @media (max-width: 700px) {

            .result-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .score-circle {
                width: 100px;
                height: 100px;
            }

            .result-card,
            .section-card {
                padding: 22px;
            }

            .result-title {
                font-size: 23px;
            }
        }

    </style>

</head>


<body data-page="results">


    <!-- Main application shell -->
    <div id="app"></div>


    <!-- Existing application scripts -->
    <script src="../js/app.js"></script>

    <script src="../js/navigation.js"></script>


    <script>

        // ------------------------------------------------
        // HTML ESCAPING
        // ------------------------------------------------

        function escapeHTML(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        // ------------------------------------------------
        // LOAD RESULTS
        // ------------------------------------------------

        function loadResults() {

            const pageContent =
                document.getElementById("pageContent");


            /*
                app.js creates #pageContent dynamically.
                If it has not been created yet, wait and try again.
            */

            if (!pageContent) {

                setTimeout(loadResults, 100);

                return;
            }


            // ---------------------------------------------
            // GET SAVED RESULT
            // ---------------------------------------------

            const rawResult =
                localStorage.getItem(
                    "vulneraSenseResult"
                );


            const submittedText =
                localStorage.getItem(
                    "vulneraSenseText"
                ) || "";


            let data = null;


            try {

                data = rawResult
                    ? JSON.parse(rawResult)
                    : null;

            } catch (error) {

                console.error(
                    "Could not read assessment result:",
                    error
                );

                data = null;
            }


            // ---------------------------------------------
            // NO ASSESSMENT
            // ---------------------------------------------

            if (!data) {

                pageContent.innerHTML = `

                    <div class="results-wrapper">

                        <p class="eyebrow">
                            ASSESSMENT RESULTS
                        </p>

                        <div class="section-card">

                            <h2>
                                No assessment yet
                            </h2>

                            <p class="section-subtitle">
                                Complete an assessment first to see your demonstration results.
                            </p>

                            <a
                                href="assessment.html"
                                class="result-button"
                            >
                                Start Assessment →
                            </a>

                        </div>

                    </div>

                `;

                return;
            }


            // ---------------------------------------------
            // RESULT DATA
            // ---------------------------------------------

            const score =
                Number(data.score) || 0;


            const level =
                data.level || {
                    key: "low",
                    name: "No assessment yet",
                    desc: "Complete an assessment first."
                };


            const safetyConcern =
                data.safetyConcern === true;


            const safetyIndicators =
                Array.isArray(data.safetyIndicators)
                    ? data.safetyIndicators
                    : [];


            const indicators =
                Array.isArray(data.indicators)
                    ? data.indicators
                    : [];


            // ---------------------------------------------
            // COMBINE INDICATORS
            // ---------------------------------------------

            const allIndicators = [
                ...safetyIndicators,
                ...indicators
            ];


            // Remove duplicates
            const uniqueIndicators =
                [...new Set(allIndicators)];


            // ---------------------------------------------
            // BUILD INDICATOR HTML
            // ---------------------------------------------

            let indicatorsHTML = "";


            if (uniqueIndicators.length > 0) {

                indicatorsHTML =
                    uniqueIndicators.map(indicator => `

                        <div class="indicator">

                            <span class="indicator-icon">
                                ✓
                            </span>

                            <span>
                                ${escapeHTML(indicator)}
                            </span>

                        </div>

                    `).join("");

            } else {

                indicatorsHTML = `

                    <div class="indicator">

                        <span class="indicator-icon">
                            ✓
                        </span>

                        <span>
                            No strong demonstration indicators detected
                        </span>

                    </div>

                `;
            }


            // ---------------------------------------------
            // SAFETY ALERT
            // ---------------------------------------------

            let safetyHTML = "";


            if (safetyConcern) {

                safetyHTML = `

                    <div class="safety-alert">

                        <span class="safety-badge">
                            SAFETY CONCERN DETECTED
                        </span>

                        <h3>
                            Human review is recommended
                        </h3>

                        <p>
                            The submitted text contains a potential
                            personal-safety concern. This automated
                            prototype cannot determine whether the
                            situation is real or provide a diagnosis.
                            A trained person should review the situation
                            and appropriate support should be considered.
                        </p>

                    </div>

                `;
            }


            // ---------------------------------------------
            // SCORE
            // ---------------------------------------------

            const safeScore =
                Math.max(
                    0,
                    Math.min(
                        100,
                        score
                    )
                );


            // ---------------------------------------------
            // RENDER PAGE
            // ---------------------------------------------

            pageContent.innerHTML = `

                <div class="results-wrapper">


                    <!-- PAGE TITLE -->

                    <h1>
                        See your results
                    </h1>


                    <!-- MAIN RESULT -->

                    <div class="result-card">

                        <div class="result-top">


                            <div class="score-circle">

                                <div class="score-number">

                                    ${safeScore}

                                    <span>
                                        /100
                                    </span>

                                </div>

                            </div>


                            <div>

                                <p class="eyebrow">
                                    Vulnerability Screening Index
                                </p>

                                <h2 class="result-title">
                                    ${escapeHTML(level.name)}
                                </h2>

                                <p class="result-description">
                                    ${escapeHTML(level.desc)}
                                </p>

                            </div>

                        </div>


                        <!-- SCORE METER -->

                        <div class="meter-section">

                            <div class="meter">

                                <div
                                    class="meter-fill"
                                    style="width:${safeScore}%"
                                ></div>

                            </div>


                            <div class="meter-labels">

                                <span>Low</span>

                                <span>Moderate</span>

                                <span>High</span>

                                <span>Critical</span>

                            </div>

                        </div>


                    </div>


                    <!-- SAFETY ALERT -->

                    ${safetyHTML}


                    <!-- OBSERVED PATTERNS -->

                    <div class="section-card">

                        <p class="eyebrow">
                            DETECTED INDICATORS
                        </p>

                        <h2>
                            Observed Patterns
                        </h2>

                        <p class="section-subtitle">
                            Signals identified by the demonstration
                            assessment engine.
                        </p>


                        <div class="indicator-list">

                            ${indicatorsHTML}

                        </div>

                    </div>


                    <!-- SUBMITTED SAMPLE -->

                    <div class="section-card">

                        <p class="eyebrow">
                            INPUT ANALYZED
                        </p>

                        <h2>
                            Submitted Sample
                        </h2>


                        <div class="submitted-text">

                            ${
                                submittedText
                                    ? escapeHTML(submittedText)
                                    : "No text was saved."
                            }

                        </div>

                    </div>


                    <!-- NEXT STEP -->

                    <div class="next-step">

                        <p class="eyebrow">
                            NEXT STEP
                        </p>

                        <h3>
                            Recommended Support
                        </h3>

                        <p>

                            ${
                                safetyConcern

                                ? "Because a potential personal-safety concern was detected, the case should receive appropriate human review. Depending on the real-world situation, suitable support may include a trusted person, counselling, legal assistance, medical assistance, or emergency services."

                                : "Consider supportive conversation and appropriate professional guidance based on the context of the situation."
                            }

                        </p>


                        <a
                            href="recommendations.html"
                            class="result-button"
                        >
                            View Support Recommendations →
                        </a>

                    </div>


                    <!-- SAFETY / PROTOTYPE NOTICE -->

                    <div class="disclaimer">

                        <strong>
                            Prototype Safety Notice:
                        </strong>

                        VulneraSense-AI is an academic
                        demonstration prototype. Its score and
                        categories are not a clinical diagnosis,
                        legal determination, or substitute for
                        professional assessment. High-priority
                        outputs should be reviewed by a trained
                        human.

                    </div>


                </div>

            `;
        }


        // ------------------------------------------------
        // WAIT FOR APP SHELL
        // ------------------------------------------------

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                loadResults();

            }
        );

    </script>


</body>

</html>
