<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
    Assessment | VulneraSense
</title>

<link
    rel="stylesheet"
    href="../css/style.css">

<link
    rel="stylesheet"
    href="../css/assessment.css">

<link
    rel="stylesheet"
    href="../css/responsive.css">

</head>


<body data-page="assessment">

<div id="app"></div>


<script src="../js/app.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/assessment.js"></script>
<script src="../js/voice.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        setTimeout(() => {

            document
                .getElementById(
                    "pageContent"
                )
                .innerHTML = `

                <div>

                    <p class="eyebrow">
                        STEP 1
                    </p>

                    <h2>
                        Input & AI Analysis
                    </h2>

                </div>


                <div class="assessment-grid">


                    <div class="card panel">

                        <div class="tabs">

                            <button
                                class="tab active"
                                id="textTab">

                                ⌨ Text

                            </button>


                            <button
                                class="tab"
                                id="voiceTab">

                                🎙 Voice

                            </button>

                        </div>


                        <div id="textMode">

                            <label>
                                Enter a short sample
                            </label>

                            <textarea
                                id="textInput"
                                placeholder="Example: I have been feeling overwhelmed and isolated lately.">
                            </textarea>

                            <p class="hint">

                                Avoid names,
                                addresses,
                                phone numbers or
                                other identifying details.

                            </p>

                        </div>


                        <div
                            id="voiceMode"
                            class="voice-box hidden">

                            <div
                                class="mic"
                                id="micButton">

                                🎙

                            </div>

                            <h3
                                id="voiceStatus">

                                Tap to record

                            </h3>

                            <p>

                                Uses browser speech
                                recognition when available.

                            </p>

                            <div
                                class="transcript"
                                id="transcript">

                                Transcript will
                                appear here…

                            </div>

                        </div>


                        <button
                            class="btn btn-primary full"
                            id="analyzeBtn">

                            Analyze with AI →

                        </button>


                        <p
                            class="hint"
                            style="text-align:center">

                            Demo scoring only —
                            not a clinical model.

                        </p>

                    </div>


                    <div class="card panel">

                        <p class="eyebrow">
                            MODEL PIPELINE
                        </p>

                        <h3>
                            AI Model Processing
                        </h3>


                        <div class="pipeline">


                            <div class="pipeline-row">

                                <span class="num">
                                    01
                                </span>

                                <div>

                                    <b>
                                        Language Processing
                                    </b>

                                    <small>
                                        Text pattern analysis
                                    </small>

                                </div>

                                <span class="tick">
                                    ✓
                                </span>

                            </div>


                            <div class="pipeline-row">

                                <span class="num">
                                    02
                                </span>

                                <div>

                                    <b>
                                        Speech Features
                                    </b>

                                    <small>
                                        Voice mode
                                    </small>

                                </div>

                                <span class="tick">
                                    ✓
                                </span>

                            </div>


                            <div class="pipeline-row">

                                <span class="num">
                                    03
                                </span>

                                <div>

                                    <b>
                                        Context Signals
                                    </b>

                                    <small>
                                        Non-diagnostic indicators
                                    </small>

                                </div>

                                <span class="tick">
                                    ✓
                                </span>

                            </div>


                            <div class="pipeline-row">

                                <span class="num">
                                    04
                                </span>

                                <div>

                                    <b>
                                        Support Routing
                                    </b>

                                    <small>
                                        Human-review pathway
                                    </small>

                                </div>

                                <span class="tick">
                                    ✓
                                </span>

                            </div>


                        </div>

                    </div>

                </div>

                `;


            document
                .getElementById("textTab")
                .onclick = () => {

                    document
                        .getElementById("textTab")
                        .classList.add("active");

                    document
                        .getElementById("voiceTab")
                        .classList.remove("active");

                    document
                        .getElementById("textMode")
                        .classList.remove("hidden");

                    document
                        .getElementById("voiceMode")
                        .classList.add("hidden");

                };


            document
                .getElementById("voiceTab")
                .onclick = () => {

                    document
                        .getElementById("voiceTab")
                        .classList.add("active");

                    document
                        .getElementById("textTab")
                        .classList.remove("active");

                    document
                        .getElementById("voiceMode")
                        .classList.remove("hidden");

                    document
                        .getElementById("textMode")
                        .classList.add("hidden");

                };


        }, 50);

    }
);

</script>

</body>
</html>
